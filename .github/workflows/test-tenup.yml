name: Test accessibilite Ten'Up

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tenup:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tester les 5 pages Ten'Up
        run: python scripts/test_tenup.py

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-test-tenup
          path: rapport-tenup.txt
          if-no-files-found: warn
